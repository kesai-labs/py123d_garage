[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=68", "wheel" ]

[project]
name = "py123d-garage-cuda"
version = "0.3.0"
description = "Opt-in CUDA kernels for py123d-garage, compiled against the installed torch"
license = { text = "Apache-2.0" }
authors = [ { name = "KE:SAI", email = "long@kesai.eu" } ]
requires-python = ">=3.10,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# No torch requirement on purpose: the kernels compile against the torch already installed, which pip must never
# replace. Install with: pip install --no-build-isolation ./cuda
dependencies = []

[tool.setuptools]
packages.find.where = [ "src" ]
