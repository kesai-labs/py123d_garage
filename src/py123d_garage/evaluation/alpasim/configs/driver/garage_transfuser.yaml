driver:
  log_level: ${wizard.log_level}

  model:
    model_type: garage
    checkpoint_path: ???
    device: "cuda"
    image_decode_device: cpu

  host: "0.0.0.0"
  port: ???

  inference:
    use_cameras:
      - "camera_front_wide_120fov"
    max_batch_size: 16
    subsample_factor: 1
    context_length: 1

  route:
    default_command: 2
    use_waypoint_commands: true
    command_distance_threshold: 3.0
    min_lookahead_distance: 20.0

  output_dir: "/tmp/alpasim_driver"

  trajectory_optimizer:
    enabled: false

  plot_debug_images: false

# The PAI challenge's simulation (+e2e_challenge=ec2): 100 ms steps, 1.7 s force-GT without driver calls, the route
# served from 40 m ahead. The driver plans at 1.7, 2.2, 2.7 s, as on the challenge, but on 2 Hz frames of the one camera
# the policy reads instead of the challenge's six 10 Hz cameras: the frames start 0.2 s after the render start (the
# camera_timing patch of lib/alpasim/tools/patches), so one lands on every plan. The nuPlan track's challenge config
# overrides these settings but the driver skip, which changes nothing there: its steps are the 500 ms plan steps.
runtime:
  simulation_config:
    control_timestep_us: 100_000
    force_gt_duration_us: 1_700_000
    skip_driver_during_force_gt: true
    route_start_offset_m: 40.0
    send_recording_ground_truth: false

    cameras:
      # NRE preserves the source aspect ratio; request 1900 wide, decoded width
      # is scene-dependent (1916 or 1920 at 1080 px height).
      - logical_id: camera_front_wide_120fov
        height: 1080
        width: 1900
        frame_interval_us: 500_000
        first_frame_offset_us: 200_000
        shutter_duration_us: 30_000
