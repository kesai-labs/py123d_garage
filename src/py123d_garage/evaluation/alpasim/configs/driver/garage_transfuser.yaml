# @package _global_

driver:
  log_level: ${wizard.log_level}

  model:
    model_type: garage
    checkpoint_path: ???
    device: "cuda"
    image_decode_device: cpu

  host: "0.0.0.0"
  port: ???

  inference:
    use_cameras:
      - "camera_cross_left_120fov"
      - "camera_front_wide_120fov"
      - "camera_cross_right_120fov"
    max_batch_size: 16
    subsample_factor: 1
    context_length: 1

  route:
    default_command: 2
    use_waypoint_commands: true
    command_distance_threshold: 3.0
    min_lookahead_distance: 20.0

  output_dir: "/tmp/alpasim_driver"

  trajectory_optimizer:
    enabled: false

  plot_debug_images: false

runtime:
  simulation_config:
    control_timestep_us: 500_000
    force_gt_duration_us: 2_000_000

    cameras:
      # NRE preserves the source aspect ratio; request 1900 wide, decoded width
      # is scene-dependent (1916 or 1920 at 1080 px height).
      - logical_id: camera_cross_left_120fov
        height: 1080
        width: 1900
        frame_interval_us: 500_000
        shutter_duration_us: 30_000
      - logical_id: camera_front_wide_120fov
        height: 1080
        width: 1900
        frame_interval_us: 500_000
        shutter_duration_us: 30_000
      - logical_id: camera_cross_right_120fov
        height: 1080
        width: 1900
        frame_interval_us: 500_000
        shutter_duration_us: 30_000
