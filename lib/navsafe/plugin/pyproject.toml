[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py123d-garage-navsafe"
version = "0.1.0"
description = "NavSafe policy adapter that drives NavSafe with a py123d_garage policy"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[project.entry-points."navsafe.policies"]
py123d_garage = "py123d_garage_navsafe:GarageAdapter"

[tool.setuptools]
py-modules = ["py123d_garage_navsafe"]
