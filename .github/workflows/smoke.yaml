      - smoke_train_live_builders
      - smoke_cache_rebuild
      - smoke_hydra_yaml_configs
      - smoke_open_loop_eval
      - smoke_navtest_eval
      - smoke_release_checkpoint
      - smoke_release_dataset
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(github.event_name == 'pull_request' && '["2021.05.25.14.16.10_veh-35_00083_00485-0c318d7923d15b78"]' || '["2021.05.25.14.16.10_veh-35_00083_00485-0c318d7923d15b78", "2021.05.25.14.16.10_veh-35_00083_00485-24567f5ad57455c4", "2021.05.25.14.16.10_veh-35_01100_01664-025b657634505df3"]') }}
    env:
      CHECKPOINT: nuplan_latent_transfuser
      PRESET: "+e2e_challenge_nuplan=dev +cameras=nuplan_3cam"
      MIN_SCORE: "0"
      # navtest scenes end 5.5 s in and the driver takes over at 2 s, so 3 s are driven closed-loop; half the scenes stay under 20 m.
      MIN_METERS: "10"
    runs-on: [self-hosted, closed-loop]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/memory_report
      - uses: ./.github/actions/python_venv
      - uses: ./.github/actions/sync_checkpoints
