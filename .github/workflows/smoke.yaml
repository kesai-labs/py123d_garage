name: smoke

# The release gates: the recipe trains end to end on the smoke datasets, every released checkpoint evaluates on
# nuPlan and Physical AI AV, and the release checkpoint drives both AlpaSim tracks from the host and the Physical AI AV
# track from the submission image.
on:
  workflow_dispatch:
  push:
    branches: [main, pre-release]

env:
  # https://huggingface.co/datasets/kesai-labs/py123d_garage_dev_data_mini
  DATA_MINI_REVISION: 1b760cf4710e2e29248a4071bb077d9295a501eb
  # https://huggingface.co/kesai-labs/py123d_garage_pretrained_checkpoints, the v0.2.0 publication; every model lives at
  # v0.2.0/<name>/{pretrain,midtrain,posttrain} with its README.md at v0.2.0/<name>, and the smoke drives posttrain.
  CHECKPOINT_REPO: kesai-labs/py123d_garage_pretrained_checkpoints
  CHECKPOINT_REVISION: afb6b51fce5c9965589dc4776777f90e72594622
  # The release checkpoint; the closed-loop jobs and the finetune drive this one.
  RELEASE_CHECKPOINT: ltf-base-joint64-68M
  RELEASE_CHECKPOINT_DIR: v0.2.0/ltf-base-joint64-68M/posttrain
  # https://huggingface.co/datasets/kesai-labs/nuplan
  PUBLIC_NUPLAN_REVISION: 484d9d14e18fdf712dbc70962997ba2d53617bce
  # https://huggingface.co/datasets/OpenDriveLab/AlpasimChallenge2026_nuplan_track, the MTGS renders of the nuPlan track.
  MTGS_REVISION: 6b3569897bd9c4f999d8aa856bb4f9e4aaa96c3c
  PY123D_GARAGE_RUNTIME_TYPE_CHECKING: "true"
  TORCHINDUCTOR_COMPILE_THREADS: "1"
  # Load CUDA kernel images on first use; the runners cap host memory.
  CUDA_MODULE_LOADING: LAZY
  # The smoke presets live next to the workflow.
  PYTHONPATH: .github/scripts
  # Enough frames to cross a batch boundary, few enough to stay a smoke.
  NUM_SCENES: "8"
  # A band wide enough to pass anything that drives; it catches a checkpoint that loads wrong or features that arrive empty.
  MAX_ADE_M: "6.0"
  # One attempt at one scene; the job budget covers three.
  DRIVE_TIMEOUT_S: "1800"
  # The recipe at smoke size: three seeds, two epochs of 16 steps, a small backbone, no compile, every pool capped.
  OVERRIDES: >-
    compile_mode=null
    wandb_config.enabled=false
    progress_bar_refresh_rate=0
    dedicated_main_core=false
    lightning_trainer_config.devices=1
    lightning_trainer_config.max_epochs=2
    lightning_trainer_config.limit_train_batches=16
    dataloader_config.batch_size=2
    dataloader_config.num_workers=0
    startup_num_workers=1
    policy_config.transfuser_config.backbone_config.image_architecture=resnet18

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke_recipe:
    if: ${{ github.repository_owner == 'kesai-labs' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: nuplan
            eval_dataset: navtest
            rigs: nuplan
          - dataset: physical_ai_av
            eval_dataset: physical_ai_av
            rigs: physical-ai-av
          # Both datasets, the first weighted twice: the only path onto the mixture sampler's partial passes.
          - dataset: mixture
            eval_dataset: physical_ai_av
            rigs: nuplan physical-ai-av
            mixture_overrides: offline_data_sources.0.source_weight=2.0
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      OUT: ${{ github.workspace }}/outputs/smoke/${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/memory_report

      - uses: ./.github/actions/python_venv

      - uses: ./.github/actions/sync_data
        with:
          hf-token: ${{ secrets.HF_TOKEN }}
          data-mini-revision: ${{ env.DATA_MINI_REVISION }}

      - uses: ./.github/actions/stage_data_root

      - name: Install py123d-garage
        run: uv pip install -e ".[train]" --group dev

      - name: Build the cache the three stages share
        run: |
          py123d-garage-cache training@plan=smoke_presets:pretrain_${{ matrix.dataset }} \
            hydra.run.dir="$OUT/cache" dataloader_config.num_workers=1

      - name: Pretrain
        run: |
          py123d-garage-training training=smoke_presets:pretrain_${{ matrix.dataset }} \
            $OVERRIDES ${{ matrix.mixture_overrides }} hydra.run.dir="$OUT/pretrain"
          for seed in 0 1 2; do test -f "$OUT/pretrain/model_${seed}_0001.pth"; done
          test -f "$OUT/pretrain/optimizer_0001.pth"
          test -f "$OUT/pretrain/trainer_state_0001.pth"
          test -f "$OUT/pretrain/config.yaml"
          for dataset in ${{ matrix.rigs }}; do test -f "$OUT/pretrain/sensor_rig_$dataset.yaml"; done

      - name: Resume the pretrain for one more epoch
        run: |
          py123d-garage-training training=smoke_presets:pretrain_${{ matrix.dataset }} \
            $OVERRIDES ${{ matrix.mixture_overrides }} hydra.run.dir="$OUT/pretrain" \
            resume_from_last_checkpoint=true lightning_trainer_config.max_epochs=3 2>&1 | tee "$OUT/resume.log"
          # A resumed run trains only the third epoch.
          grep -q "Epoch 3/3" "$OUT/resume.log"
          ! grep -q "Epoch 1/3" "$OUT/resume.log"
          test -f "$OUT/pretrain/model_0_0002.pth"

      - name: Midtrain from the pretrained seeds
        run: |
          py123d-garage-training training=smoke_presets:midtrain_${{ matrix.dataset }} \
            $OVERRIDES ${{ matrix.mixture_overrides }} hydra.run.dir="$OUT/midtrain" \
            initial_weights_files="[$OUT/pretrain/model_0_0002.pth,$OUT/pretrain/model_1_0002.pth,$OUT/pretrain/model_2_0002.pth]"
          test -f "$OUT/midtrain/model_0_0001.pth"

      - name: Posttrain from the midtrained seeds
        run: |
          py123d-garage-training training=smoke_presets:posttrain_${{ matrix.dataset }} \
            $OVERRIDES ${{ matrix.mixture_overrides }} hydra.run.dir="$OUT/posttrain" \
            initial_weights_files="[$OUT/midtrain/model_0_0001.pth,$OUT/midtrain/model_1_0001.pth,$OUT/midtrain/model_2_0001.pth]"
          test -f "$OUT/posttrain/model_0_0001.pth"
          for dataset in ${{ matrix.rigs }}; do test -f "$OUT/posttrain/sensor_rig_$dataset.yaml"; done

      - uses: ./.github/actions/sync_public_nuplan
        if: matrix.eval_dataset == 'navtest'
        with:
          hf-token: ${{ secrets.HF_TOKEN }}
          revision: ${{ env.PUBLIC_NUPLAN_REVISION }}

      - uses: ./.github/actions/stage_public_data_root
        if: matrix.eval_dataset == 'navtest'

      - name: Open loop with the posttrained checkpoint, replaying its saved config
        run: |
          .github/scripts/eval_slice.sh open_loop "$OUT/posttrain/model_0_0001.pth" \
            "${{ matrix.eval_dataset }}" "$NUM_SCENES" "$OUT/open_loop"

  smoke_release_checkpoints:
    if: ${{ github.repository_owner == 'kesai-labs' }}
    strategy:
      fail-fast: false
      matrix:
        checkpoint: [ltf-base-waypoints-68M, ltf-base-joint32-68M, ltf-base-joint64-68M, ltf-streaming-joint64-68M]
        section: [open_loop]
        include:
          - checkpoint: ltf-base-joint64-68M
            section: ensemble
          - checkpoint: ltf-base-joint64-68M
            section: finetune
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}/outputs/smoke/release/${{ matrix.checkpoint }}/${{ matrix.section }}
      CHECKPOINT_DIR: v0.2.0/${{ matrix.checkpoint }}/posttrain
      # A strict load of the released weights refuses another backbone, and the release architecture has no smoke store.
      FINETUNE_OVERRIDES: >-
        compile_mode=null
        read_from_cache_store=false
        wandb_config.enabled=false
        progress_bar_refresh_rate=0
        dedicated_main_core=false
        num_seeds=1
        lightning_trainer_config.devices=1
        lightning_trainer_config.max_epochs=2
        lightning_trainer_config.limit_train_batches=16
        dataloader_config.batch_size=2
        dataloader_config.num_workers=0
        startup_num_workers=1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/memory_report

      - uses: ./.github/actions/python_venv

      - uses: ./.github/actions/sync_checkpoints
        with:
          hf-token: ${{ secrets.HF_TOKEN }}
          repo: ${{ env.CHECKPOINT_REPO }}
          revision: ${{ env.CHECKPOINT_REVISION }}
          include: "v0.2.0/${{ matrix.checkpoint }}/README.md ${{ env.CHECKPOINT_DIR }}/*"

      - uses: ./.github/actions/sync_data
        if: matrix.section == 'open_loop' || matrix.section == 'finetune'
        with:
          hf-token: ${{ secrets.HF_TOKEN }}
          data-mini-revision: ${{ env.DATA_MINI_REVISION }}

      - uses: ./.github/actions/stage_data_root
        if: matrix.section == 'open_loop' || matrix.section == 'finetune'

      - name: Install py123d-garage
        run: uv pip install -e ".[train]" --group dev

      - name: Check the published files of ${{ matrix.checkpoint }}
        run: |
          dir="$CHECKPOINT_CACHE/$CHECKPOINT_DIR"
          for seed in 0 1 2; do test -f "$dir/model_$seed.pth"; done
          test -f "$dir/config.yaml"
          test -f "$CHECKPOINT_CACHE/v0.2.0/${{ matrix.checkpoint }}/README.md"
          # The rigs of the training datasets the AlpaSim scripts drive with
          for dataset in nurec nuplan; do test -f "$dir/sensor_rig_$dataset.yaml"; done

      - name: Open loop on the Physical AI AV test split
        if: matrix.section == 'open_loop'
        run: |
          .github/scripts/eval_slice.sh open_loop "$CHECKPOINT_CACHE/$CHECKPOINT_DIR/model_0.pth" \
            physical_ai_av "$NUM_SCENES" "$OUT/physical_ai_av" "$MAX_ADE_M"

      - uses: ./.github/actions/sync_public_nuplan
        if: matrix.section == 'open_loop' || matrix.section == 'ensemble'
        with:
          hf-token: ${{ secrets.HF_TOKEN }}
          revision: ${{ env.PUBLIC_NUPLAN_REVISION }}

      # The public nuPlan slice replaces the mini data root once the Physical AI AV slice is scored.
      - uses: ./.github/actions/stage_public_data_root
        if: matrix.section == 'open_loop' || matrix.section == 'ensemble'

      - name: Open loop on the nuPlan test split
        if: matrix.section == 'open_loop'
        run: |
          .github/scripts/eval_slice.sh open_loop "$CHECKPOINT_CACHE/$CHECKPOINT_DIR/model_0.pth" \
            navtest "$NUM_SCENES" "$OUT/nuplan" "$MAX_ADE_M"

      - name: Open loop with two seeds as an ensemble
        if: matrix.section == 'ensemble'
        run: |
          dir="$CHECKPOINT_CACHE/$CHECKPOINT_DIR"
          source_override="$(python .github/scripts/eval_source.py "$dir/model_0.pth" navtest "$NUM_SCENES")"
          py123d-garage-evaluation-open-loop \
            hydra.run.dir="$OUT" \
            policy_config.evaluation_checkpoint_files="[$dir/model_0.pth,$dir/model_1.pth]" \
            parallelization_config.device=cuda \
            parallelization_config.inference_batch_size=2 \
            parallelization_config.max_workers=1 \
            "$source_override"
          test -s "$OUT/results.csv"
          cat "$OUT/results.csv"

      - name: Finetune with a strict load of the released weights
        if: matrix.section == 'finetune'
        run: |
          py123d-garage-training training=smoke_presets:posttrain_mixture \
            $FINETUNE_OVERRIDES hydra.run.dir="$OUT" \
            initial_weights_files="[$CHECKPOINT_CACHE/$CHECKPOINT_DIR/model_0.pth]" \
            initial_weights_strict=true
          test -f "$OUT/model_0_0001.pth"

  # Closed loop needs most of a GPU, so it runs once the jobs above are finished, passed or not.
  smoke_alpasim_pai_closed_loop:
    if: ${{ !cancelled() && github.repository_owner == 'kesai-labs' }}
    needs: [smoke_recipe, smoke_release_checkpoints]
    runs-on: [self-hosted, closed-loop]
    timeout-minutes: 120
    env:
      # A short nurec_curated_val scene; a collision or offroad event scores 0.
      SCENE: clipgt-098e2482-6db2-473b-b08a-2a80be9320f3
      MIN_SCORE: "1"
      MIN_METERS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/memory_report

      - uses: ./.github/actions/python_venv

      - uses: ./.github/actions/sync_checkpoints
        with:
          hf-token: ${{ secrets.HF_TOKEN }}
          repo: ${{ env.CHECKPOINT_REPO }}
          revision: ${{ env.CHECKPOINT_REVISION }}
          include: "${{ env.RELEASE_CHECKPOINT_DIR }}/*"

      - uses: ./.github/actions/alpasim_workspace
        with:
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Drive ${{ env.SCENE }} on the Physical AI AV track with ${{ env.RELEASE_CHECKPOINT }}
        run: |
          .github/scripts/eval_alpasim_scene.sh "$CHECKPOINT_CACHE/$RELEASE_CHECKPOINT_DIR/model_0.pth" \
            "$SCENE" "$RUNNER_TEMP/alpasim/$SCENE" "$MIN_SCORE" "$MIN_METERS"

      - name: Stop this runner's simulation containers and prune what no job uses
        if: always()
        run: |
          docker ps -aq --filter "name=^ci-${RUNNER_NAME,,}-" | xargs -r docker rm -f
          docker network prune -f || true
          docker image prune -f || true
          docker builder prune -f --filter until=72h || true

  smoke_alpasim_nuplan_closed_loop:
    if: ${{ !cancelled() && github.repository_owner == 'kesai-labs' }}
    needs: [smoke_recipe, smoke_release_checkpoints]
    runs-on: [self-hosted, closed-loop]
    timeout-minutes: 120
    env:
      # A navtest scene rendered by MTGS; it ends 5.5 s in and the driver takes over at 2 s, so 3 s drive closed loop.
      SCENE: 2021.05.25.14.16.10_veh-35_00083_00485-0c318d7923d15b78
      MIN_SCORE: "0"
      MIN_METERS: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/memory_report

      - uses: ./.github/actions/python_venv

      - uses: ./.github/actions/sync_checkpoints
        with:
          hf-token: ${{ secrets.HF_TOKEN }}
          repo: ${{ env.CHECKPOINT_REPO }}
          revision: ${{ env.CHECKPOINT_REVISION }}
          include: "${{ env.RELEASE_CHECKPOINT_DIR }}/*"

      - uses: ./.github/actions/sync_mtgs
        with:
          hf-token: ${{ secrets.HF_TOKEN }}
          revision: ${{ env.MTGS_REVISION }}

      - uses: ./.github/actions/alpasim_workspace
        with:
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Drive ${{ env.SCENE }} on the nuPlan track with ${{ env.RELEASE_CHECKPOINT }}
        run: |
          TRACK=nuplan ALPASIM_NUPLAN_ROOT="$MTGS_ROOT" .github/scripts/eval_alpasim_scene.sh \
            "$CHECKPOINT_CACHE/$RELEASE_CHECKPOINT_DIR/model_0.pth" \
            "$SCENE" "$RUNNER_TEMP/alpasim_nuplan/$SCENE" "$MIN_SCORE" "$MIN_METERS"

      - name: Stop this runner's simulation containers and prune what no job uses
        if: always()
        run: |
          docker ps -aq --filter "name=^ci-${RUNNER_NAME,,}-" | xargs -r docker rm -f
          docker network prune -f || true
          docker image prune -f || true
          docker builder prune -f --filter until=72h || true

  smoke_alpasim_submission:
    if: ${{ !cancelled() && github.repository_owner == 'kesai-labs' }}
    needs: [smoke_recipe, smoke_release_checkpoints]
    runs-on: [self-hosted, closed-loop]
    timeout-minutes: 150
    env:
      SCENE: clipgt-098e2482-6db2-473b-b08a-2a80be9320f3
      MIN_SCORE: "1"
      MIN_METERS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/memory_report

      - uses: ./.github/actions/python_venv

      - uses: ./.github/actions/sync_checkpoints
        with:
          hf-token: ${{ secrets.HF_TOKEN }}
          repo: ${{ env.CHECKPOINT_REPO }}
          revision: ${{ env.CHECKPOINT_REVISION }}
          include: "${{ env.RELEASE_CHECKPOINT_DIR }}/*"

      - uses: ./.github/actions/alpasim_workspace
        with:
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Build, serve and drive the submission image of ${{ env.RELEASE_CHECKPOINT }}
        run: |
          .github/scripts/eval_alpasim_submission.sh "$CHECKPOINT_CACHE/$RELEASE_CHECKPOINT_DIR/model_0.pth" \
            "$SCENE" "$RUNNER_TEMP/alpasim_submission" "$MIN_SCORE" "$MIN_METERS"

      - name: Stop this runner's simulation containers and prune what no job uses
        if: always()
        run: |
          docker ps -aq --filter "name=^ci-${RUNNER_NAME,,}-" | xargs -r docker rm -f
          docker network prune -f || true
          docker image prune -f || true
          docker builder prune -f --filter until=72h || true
