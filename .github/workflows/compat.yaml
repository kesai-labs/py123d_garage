name: compat

# Validates pyproject's requires-python claim and dependency bounds beyond ci's 3.10.
on:
  push:
    branches: [main, pre-release]
    paths-ignore:
      - "**/docs/**"
      - "**/README.md"
  workflow_dispatch:

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        resolution: [highest]
        include:
          - python-version: "3.10"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/memory_report

      - uses: ./.github/actions/python_venv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install py123d-garage
        run: uv pip install --resolution ${{ matrix.resolution }} -e ".[train]" --group dev

      - name: Test with pytest
        env:
          PY123D_GARAGE_RUNTIME_TYPE_CHECKING: "true"
          PY123D_GARAGE_DATA_ROOT: "/data"
        run: pytest tests/unit -m ""
